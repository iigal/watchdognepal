<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Rhododendron (Lali Gurans) - Nepal's national flower -->
  <!-- Leaves -->
  <g fill="#2d5a27" opacity="0.8">
    <ellipse cx="60" cy="160" rx="35" ry="10" transform="rotate(-30 60 160)" />
    <ellipse cx="140" cy="160" rx="35" ry="10" transform="rotate(30 140 160)" />
    <ellipse cx="40" cy="140" rx="30" ry="9" transform="rotate(-50 40 140)" />
    <ellipse cx="160" cy="140" rx="30" ry="9" transform="rotate(50 160 140)" />
    <ellipse cx="100" cy="170" rx="32" ry="9" transform="rotate(5 100 170)" />
  </g>
  <!-- Leaf veins -->
  <g stroke="#1a3d18" stroke-width="0.5" opacity="0.4">
    <line x1="35" y1="150" x2="80" y2="165" />
    <line x1="165" y1="150" x2="120" y2="165" />
    <line x1="100" y1="162" x2="100" y2="178" />
  </g>
  <!-- Flower cluster - multiple overlapping petals -->
  <!-- Center flower -->
  <g transform="translate(100, 95)">
    <ellipse cx="-12" cy="-8" rx="14" ry="10" fill="#DC143C" transform="rotate(-20)" />
    <ellipse cx="12" cy="-8" rx="14" ry="10" fill="#DC143C" transform="rotate(20)" />
    <ellipse cx="-15" cy="5" rx="14" ry="10" fill="#DC143C" transform="rotate(-40)" />
    <ellipse cx="15" cy="5" rx="14" ry="10" fill="#DC143C" transform="rotate(40)" />
    <ellipse cx="0" cy="12" rx="14" ry="10" fill="#DC143C" />
    <circle cx="0" cy="0" r="6" fill="#8B0000" opacity="0.6" />
    <!-- Stamens -->
    <line x1="0" y1="0" x2="-4" y2="-8" stroke="#8B0000" stroke-width="1" />
    <line x1="0" y1="0" x2="4" y2="-8" stroke="#8B0000" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#8B0000" stroke-width="1" />
    <circle cx="-4" cy="-8" r="1.5" fill="#FFD700" />
    <circle cx="4" cy="-8" r="1.5" fill="#FFD700" />
    <circle cx="0" cy="-10" r="1.5" fill="#FFD700" />
  </g>
  <!-- Left flower -->
  <g transform="translate(65, 85)">
    <ellipse cx="-10" cy="-7" rx="12" ry="9" fill="#E8192C" transform="rotate(-25)" />
    <ellipse cx="10" cy="-7" rx="12" ry="9" fill="#E8192C" transform="rotate(25)" />
    <ellipse cx="-12" cy="4" rx="12" ry="9" fill="#E8192C" transform="rotate(-45)" />
    <ellipse cx="12" cy="4" rx="12" ry="9" fill="#E8192C" transform="rotate(45)" />
    <ellipse cx="0" cy="10" rx="12" ry="9" fill="#E8192C" />
    <circle cx="0" cy="0" r="5" fill="#8B0000" opacity="0.5" />
    <circle cx="-3" cy="-6" r="1.2" fill="#FFD700" />
    <circle cx="3" cy="-6" r="1.2" fill="#FFD700" />
  </g>
  <!-- Right flower -->
  <g transform="translate(135, 85)">
    <ellipse cx="-10" cy="-7" rx="12" ry="9" fill="#E8192C" transform="rotate(-25)" />
    <ellipse cx="10" cy="-7" rx="12" ry="9" fill="#E8192C" transform="rotate(25)" />
    <ellipse cx="-12" cy="4" rx="12" ry="9" fill="#E8192C" transform="rotate(-45)" />
    <ellipse cx="12" cy="4" rx="12" ry="9" fill="#E8192C" transform="rotate(45)" />
    <ellipse cx="0" cy="10" rx="12" ry="9" fill="#E8192C" />
    <circle cx="0" cy="0" r="5" fill="#8B0000" opacity="0.5" />
    <circle cx="-3" cy="-6" r="1.2" fill="#FFD700" />
    <circle cx="3" cy="-6" r="1.2" fill="#FFD700" />
  </g>
  <!-- Top flower bud -->
  <g transform="translate(100, 55)">
    <ellipse cx="-8" cy="-5" rx="10" ry="8" fill="#CC1133" transform="rotate(-15)" />
    <ellipse cx="8" cy="-5" rx="10" ry="8" fill="#CC1133" transform="rotate(15)" />
    <ellipse cx="0" cy="6" rx="10" ry="8" fill="#CC1133" />
    <circle cx="0" cy="-2" r="4" fill="#8B0000" opacity="0.4" />
  </g>
  <!-- Small buds -->
  <g transform="translate(50, 110)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#CC1133" transform="rotate(-30)" />
    <ellipse cx="5" cy="3" rx="7" ry="5" fill="#CC1133" transform="rotate(10)" />
  </g>
  <g transform="translate(150, 110)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#CC1133" transform="rotate(30)" />
    <ellipse cx="-5" cy="3" rx="7" ry="5" fill="#CC1133" transform="rotate(-10)" />
  </g>
  <!-- Stems -->
  <g stroke="#2d5a27" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M100 120 Q100 140 95 165" />
    <path d="M70 110 Q65 135 60 160" />
    <path d="M130 110 Q135 135 140 160" />
  </g>
</svg>