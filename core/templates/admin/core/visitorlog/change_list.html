{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrahead %}
{{ block.super }}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Leaflet Heatmap Plugin -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<style>
    #visitor-map {
        height: 400px;
        width: 100%;
        border-radius: 8px;
        margin-bottom: 20px;
        z-index: 1; /* Keep below jazzmin navbar */
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card card-outline card-primary">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-map-marked-alt mr-1"></i> Visitor Heatmap
                </h3>
            </div>
            <div class="card-body p-0">
                <div id="visitor-map"></div>
            </div>
        </div>
    </div>
</div>

{{ block.super }}

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Initialize Map centered roughly on Nepal
        var map = L.map('visitor-map').setView([28.3949, 84.1240], 6);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Load thermal data from django context
        var heatData = {{ heat_data_json|safe }};
        
        if (heatData && heatData.length > 0) {
            // Draw heatmap
            var heat = L.heatLayer(heatData, {
                radius: 25,
                blur: 15,
                maxZoom: 17,
                gradient: {
                    0.4: 'blue',
                    0.6: 'cyan',
                    0.7: 'lime',
                    0.8: 'yellow',
                    1.0: 'red'
                }
            }).addTo(map);

            // Add markers for distinct locations just to make them clickable/visible
            var distinctLocations = new Set();
            heatData.forEach(function(point) {
                var key = point[0] + "," + point[1];
                if (!distinctLocations.has(key)) {
                    distinctLocations.add(key);
                    L.marker([point[0], point[1]]).addTo(map)
                     .bindPopup("Activity detected here");
                }
            });
            
            // Auto fit bounds if there's data
            var group = new L.featureGroup(
                Array.from(distinctLocations).map(function(k) {
                    var parts = k.split(',');
                    return L.marker([parseFloat(parts[0]), parseFloat(parts[1])]);
                })
            );
            map.fitBounds(group.getBounds().pad(0.5));
        } else {
            console.log("No heatmap data available.");
        }
    });
</script>
{% endblock %}
