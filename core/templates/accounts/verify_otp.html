{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Verify Mobile Number — Watchdog Nepal{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7 col-sm-10">

      <div class="text-center mb-4 animate-fade-in-up">
        <h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.75rem;">
          Verify Mobile Number
        </h2>
        <p style="font-size: 0.88rem; color: var(--wn-text-muted);">
          Please enter the 6-digit verification code sent to <strong>{{ mobile }}</strong>.
        </p>
      </div>

      <div class="wn-auth-card animate-fade-in-up animate-delay-1">
        <div class="card-body">

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="otp" class="form-label fw-bold">Verification Code</label>
              <input type="text" class="form-control text-center" id="otp" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6" pattern="\d{6}">
            </div>
            
            <div class="d-grid mt-4">
              <button type="submit" class="wn-btn-primary justify-content-center w-100">
                <i class="bi bi-check-circle me-1"></i> Verify Code
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
